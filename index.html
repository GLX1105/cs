<!DOCTYPE html>
<html lang="zh-CN">

    <style>

        .card-title .result-summary { font-weight:normal; font-size:.85em; display:flex; gap:15px; margin-left:auto; }
        .user-select-container { display:flex; align-items:center; gap:6px; margin-left:12px; }
        .user-select-container label { font-size:.8em; white-space:nowrap; }

        .result-line { white-space:pre-wrap; word-break:break-all; }
        .btn { padding:8px 12px; border:none; border-radius:25px; cursor:pointer; font-size:14px; font-weight:bold; min-height:36px; transition:all .25s; font-family:inherit; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,.15); }
        .btn-paste { background:#2ecc71; color:#fff; }
        .btn-save-order { background:#f1c40f; color:#fff; }
        .btn-clear { background:#95a5a6; color:#fff; }
        .btn-cancel { background:#9b59b6; color:#fff; }
        .btn-separator { background:#3498db; color:#fff; }

        .btn-group { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }

        .modal-header .modal-actions button { background:none; border:none; color:#fff; font-size:1.2em; cursor:pointer; padding:2px 6px; border-radius:4px; }
        .modal-header .modal-actions button:hover { background:rgba(255,255,255,0.2); }
        .modal-body { padding:20px; overflow-y:auto; flex:1; }
        .modal .form-group { margin-bottom:12px; }
        .modal .form-group label { display:block; font-size:.85em; color:#666; margin-bottom:4px; }
        .modal .form-group input { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:1em; outline:none; }
        .modal .btn-submit { padding:10px 20px; background:var(--accent); color:#fff; border:none; border-radius:25px; cursor:pointer; }
        .table-container { width:100%; overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
        th { background:#f0f0f0; font-weight:bold; color:#1a1a2e; padding:5px 6px; border:1px solid #ddd; white-space:nowrap; }
        td { border:1px solid #ddd; padding:5px 6px; text-align:center; white-space:nowrap; }

        @media(max-width:768px) { .order-input-container { flex-direction:column; } }
    </style>
</head>

</div>

<script>

const NUM_TO_ZODIAC={}; for(let [z,nums] of Object.entries(ZODIAC_NUMS)) nums.split(/[\s,，]+/).forEach(n=>NUM_TO_ZODIAC[n]=z);
const ATTR_TO_ZODIACS={家禽:'牛马羊鸡狗猪',家肖:'牛马羊鸡狗猪',家畜:'牛马羊鸡狗猪',家:'牛马羊鸡狗猪',野兽:'鼠虎兔龙蛇猴',野肖:'鼠虎兔龙蛇猴',野:'鼠虎兔龙蛇猴',马边:'马羊猴鸡狗猪',鼠边:'鼠牛虎兔龙蛇',单笔画肖:'鼠猪鸡马蛇龙',双笔画肖:'兔虎牛狗猴羊',吉肖:'兔鸡羊马蛇龙',凶肖:'虎牛鼠猪狗猴',天肖:'兔牛猪猴马龙',地肖:'虎鼠狗鸡羊蛇',阴肖:'鼠猪狗马蛇龙',阳肖:'兔虎牛鸡猴羊',男肖:'虎牛鼠狗猴马龙',女肖:'兔猪鸡羊蛇',朝肖:'兔猴羊马蛇龙',夕肖:'虎牛鼠猪狗鸡',前肖:'鼠牛虎兔龙蛇',后肖:'马羊猴鸡狗猪',左肖:'鼠牛龙蛇猴鸡',右肖:'虎兔马羊狗猪',有偏旁肖:'猪狗鸡猴蛇',无偏旁肖:'兔虎牛鼠羊马龙'};

蓝单'];d['蓝波双']=d['蓝双'];d['兰波单']=d['蓝单'];d['兰波双']=d['蓝双'];d['兰单']=d['蓝单'];d['兰双']=d['蓝双'];d['绿波单']=d['绿单'];d['绿波双']=d['绿双'];const tails={0:'10 20 30 40',1:'01 11 21 31 41',2:'02 12 22 32 42',3:'03 13 23 33 43',4:'04 14 24 34 44',5:'05 15 25 35 45',6:'06 16 26 36 46',7:'07 17 27 37 47',8:'08 18 28 38 48',9:'09 19 29 39 49'};for(let i=0;i<=9;i++)d[i+'尾']=tails[i];const cnT=['零','一','二','三','四','五','六','七','八','九'];for(let i=0;i<=9;i++)d[cnT[i]+'尾']=tails[i];d['小尾']='10 20 30 40 01 11 21 31 41 02 12 22 32 42 03 13 23 33 43 04 14 24 34 44';d['大尾']='05 15 25 35 45 06 16 26 36 46 07 17 27 37 47 08 18 28 38 48 09 19 29 39 49';const arr0=[];for(let i=1;i<=9;i++)arr0.push(String(i).padStart(2,'0'));d['0头']=arr0.join(' ');d['0头单']=arr0.filter(n=>parseInt(n)%2===1).join(' ');d['0头双']=arr0.filter(n=>parseInt(n)%2===0).join(' ');for(let h=1;h<=4;h++){const arr=[];for(let i=0;i<10;i++){const n=h*10+i;if(n<=49)arr.push(String(n).padStart(2,'0'));}d[h+'头']=arr.join(' ');d[h+'头单']=arr.filter(n=>parseInt(n)%2===1).join(' ');d[h+'头双']=arr.filter(n=>parseInt(n)%2===0).join(' ');}for(let[k,v]of Object.entries(AGE_TO_NUMS)){d[k]=v;}const hes={'1合':'01 10','2合':'02 11 20','3合':'03 12 21 30','4合':'04 13 22 31 40','5合':'05 14 23 32 41','6合':'06 15 24 33 42','7合':'07 16 25 34 43','8合':'08 17 26 35 44','9合':'09 18 27 36 45','10合':'19 28 37 46','11合':'29 38 47','12合':'39 48','13合':'49'};for(let[k,v]of Object.entries(hes))d[k]=v;const cnHe=['一','二','三','四','五','六','七','八','九','十','十一','十二','十三'];for(let i=1;i<=13;i++)d[cnHe[i-1]+'合']=hes[i+'合'];d['金']='04 05 12 13 26 27 34 35 42 43';d['木']='08 09 16 17 24 25 38 39 46 47';d['水']='01 14 15 22 23 30 31 44 45';d['火']='02 03 10 11 18 19 32 33 40 41 48 49';d['土']='06 07 20 21 28 29 36 37';d['反数']='12 13 14 21 23 24 31 32 34 41 42 43';d['内围码']='09 10 11 12 13 16 17 18 19 20 23 24 25 26 27 30 31 32 33 34 37 38 39 40 41';d['外围码']='01 02 03 04 05 06 07 08 14 15 21 22 28 29 35 36 42 43 44 45 46 47 48 49';d['前码']='01 02 03 04 05 06 07 08 17 18 19 20 21 22 23 27 29 30 31 34 37 39 40 41 44 47 49';d['地码']='02 03 05 06 08 12 13 15 16 18 22 23 25 26 28 32 33 35 36 38 42 43 45 46 48';return d;}

// ========== IndexedDB 存储 ==========
const DB_NAME='LotteryDB',DB_VERSION=2;let db=null;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('users'))d.createObjectStore('users',{keyPath:'name'});if(!d.objectStoreNames.contains('topOrders'))d.createObjectStore('topOrders',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('allOrders'))d.createObjectStore('allOrders',{keyPath:'id',autoIncrement:true});};r.onsuccess=e=>{db=e.target.result;console.log('数据库打开成功');resolve(db);};r.onerror=e=>{console.error('数据库打开失败:',e.target.error);reject(r.error);};});}
let _usersCache=[];
async function getUsers(){try{if(_usersCache.length)return[..._usersCache];await openDB();return new Promise(res=>{const tx=db.transaction('users','readonly');const r=tx.objectStore('users').getAll();r.onsuccess=()=>{_usersCache=r.result.map(u=>u.name);res([..._usersCache]);};r.onerror=()=>{console.error('读取用户列表失败');res([]);};});}catch(e){console.error('getUsers异常:',e);return[];}}
async function saveUsers(users){_usersCache=[...users];await openDB();const tx=db.transaction('users','readwrite');const store=tx.objectStore('users');await store.clear();for(const n of users)await store.put({name:n});}
async function getTopOrders(){await openDB();return new Promise(res=>{const tx=db.transaction('topOrders','readonly');tx.objectStore('topOrders').getAll().onsuccess=e=>res(e.target.result);});}
async function saveTopOrders(orders){await openDB();const tx=db.transaction('topOrders','readwrite');const store=tx.objectStore('topOrders');await store.clear();for(const o of orders)await store.put(o);}
async function getAllOrders(){await openDB();return new Promise(res=>{const tx=db.transaction('allOrders','readonly');tx.objectStore('allOrders').getAll().onsuccess=e=>res(e.target.result);});}
async function saveAllOrders(orders){await openDB();const tx=db.transaction('allOrders','readwrite');const store=tx.objectStore('allOrders');await store.clear();for(const o of orders)await store.put(o);}
async function getUserOrderCount(user){const orders=await getTopOrders();const set=new Set(orders.filter(o=>o.user===user).map(o=>o.orderSeq));return set.size;}

function attachTooltipEvents(){document.querySelectorAll('.detail-cell').forEach(cell=>{cell.addEventListener('mouseenter',function(e){if(this.scrollWidth<=this.clientWidth)return;const tip=document.getElementById('globalTooltip');tip.textContent=this.dataset.full||this.textContent.trim();tip.style.display='block';const r=this.getBoundingClientRect();tip.style.left=r.left+'px';tip.style.top=(r.top-tip.offsetHeight-6)+'px';});cell.addEventListener('mouseleave',()=>document.getElementById('globalTooltip').style.display='none');});}

// ========== 保存下单 ==========
async function saveOrder(){if(!currentUser)return alert('请先选择下单人');const lines=window._pureOrderLines,regions=window._pureOrderRegions||[];if(!lines.length)return alert('无订单');const regionGroups={};lines.forEach((l,i)=>{const r=regions[i]||'macau';(regionGroups[r]=regionGroups[r]||[]).push(l);});const topOrders=await getTopOrders();const seq=(await getUserOrderCount(currentUser))+1;let maxId=topOrders.reduce((m,o)=>Math.max(m,o.id||0),0);for(const[region,linesArr]of Object.entries(regionGroups)){for(const line of linesArr){const m=line.match(/^(.+?):(.+?)\s+(各(?:数|))\s*(\d+)$/);if(!m)continue;const playType=m[1],detail=m[2],calcMethod=m[3]||'各',unitAmount=parseInt(m[4])||0;const res=countItemsInLine(line);let total=unitAmount;if(res.playType==='特肖'&&res.zodiacCount)total=res.zodiacCount*res.amount;else if(res.numbers.length&&res.amount)total=res.numbers.length*res.amount;topOrders.push({id:++maxId,region:REGION_LABELS[region]||region,playType,detail,multiType:'no',calcMethod,unitAmount,totalAmount:total,orderSeq:seq,user:currentUser,winStatus:'',winAmount:'',remark:''});}}await saveTopOrders(topOrders);refreshTopTable();alert(`已保存为${currentUser}的第${seq}条订单`);}

// ========== 发送到主表格 ==========
async function sendOrdersToMain(){const topOrders=await getTopOrders();if(!topOrders.length)return alert('没有可发送的订单');if(!confirm('确认将当前表格所有订单发送到"所有订单"吗？'))return;const allOrders=await getAllOrders();let maxId=allOrders.reduce((m,o)=>Math.max(m,o.id||0),0);topOrders.forEach(o=>allOrders.push({...o,id:++maxId}));await saveAllOrders(allOrders);refreshMainTable();alert('已发送');}

// ========== 弹窗与交互 ==========
function closeModal(id){document.getElementById(id).classList.remove('show');}
function minimizeModal(id){const m=document.querySelector(`#${id} .modal`);if(m){m.style.height='40px';m.style.overflow='hidden';}}
function maximizeModal(id){const m=document.querySelector(`#${id} .modal`);if(m){m.style.height='';m.style.overflow='';}}
function openAddUserModal(){document.getElementById('addUserModal').classList.add('show');document.getElementById('newUserName').value='';setTimeout(async()=>{try{await refreshUserListInModal();}catch(e){console.error(e);}document.getElementById('newUserName').focus();},150);}
async function refreshUserListInModal(){const users=await getUsers();const countSpan=document.getElementById('userCount');const container=document.getElementById('userListContainer');if(countSpan)countSpan.textContent=users.length;if(!container)return;if(users.length===0){container.innerHTML='<div style="text-align:center;color:#999;padding:20px;">暂无下单人</div>';return;}let html='';users.forEach((u,index)=>{html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:.9em;"><span>${u}</span><button onclick="deleteUser(${index})" style="background:#e74c3c;color:#fff;border:none;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:.8em;font-family:inherit;">删除</button></div>`;});container.innerHTML=html;}
async function deleteUser(index){if(!confirm('确定删除该下单人吗？'))return;const users=await getUsers();if(index<0||index>=users.length)return;const deletedName=users[index];users.splice(index,1);await saveUsers(users);await refreshUserListInModal();await refreshUserSelect();if(currentUser===deletedName){currentUser='';const select=document.getElementById('currentUserSelect');if(select)select.value='';}}
async function saveNewUser(){const input=document.getElementById('newUserName');if(!input)return;const name=input.value.trim();if(!name){alert('请输入名字');return;}try{const users=await getUsers();if(users.includes(name)){alert('该下单人已存在');return;}users.push(name);await saveUsers(users);input.value='';await refreshUserListInModal();await refreshUserSelect();const select=document.getElementById('currentUserSelect');if(select){select.value=name;currentUser=name;}setTimeout(()=>input.focus(),100);}catch(e){console.error('保存用户失败:',e);alert('保存失败，请重试');}}
function onUserChange(){const select=document.getElementById('currentUserSelect');currentUser=select?select.value:'';}
async function refreshUserSelect(){const users=await getUsers();const select=document.getElementById('currentUserSelect');if(!select)return;const oldValue=select.value;select.innerHTML='<option value="">-- 请选择 --</option>';users.forEach(u=>{const option=document.createElement('option');option.value=u;option.textContent=u;select.appendChild(option);});if(users.includes(oldValue)){select.value=oldValue;currentUser=oldValue;}else if(users.length>0){select.value=users[users.length-1];currentUser=users[users.length-1];}else{select.value='';currentUser='';}}

// 拖拽
let dragInfo=null;document.addEventListener('mousedown',e=>{const h=e.target.closest('.modal-header');if(!h)return;const modal=h.closest('.modal');if(!modal)return;dragInfo={modal,x:e.clientX-modal.getBoundingClientRect().left,y:e.clientY-modal.getBoundingClientRect().top};modal.style.transition='none';});document.addEventListener('mousemove',e=>{if(!dragInfo)return;dragInfo.modal.style.left=(e.clientX-dragInfo.x)+'px';dragInfo.modal.style.top=(e.clientY-dragInfo.y)+'px';});document.addEventListener('mouseup',()=>{if(dragInfo)dragInfo.modal.style.transition='';dragInfo=null;});

// 其他按钮
const inputTextArea=document.getElementById('inputText');inputTextArea.addEventListener('input',()=>performRecognition(inputTextArea.value));
function clearAll(){inputTextArea.value='';performRecognition('');}
async function pasteFromClipboard(){try{const t=await navigator.clipboard.readText();if(t){inputTextArea.value=t;inputTextArea.dispatchEvent(new Event('input'));}}catch(e){alert('无法访问剪切板');}}
function changeSep(){const ta=inputTextArea;if(ta.selectionStart!==ta.selectionEnd){const start=ta.selectionStart,end=ta.selectionEnd;const selected=ta.value.substring(start,end);const result=selected.replace(/[^\dA-Za-z\u4e00-\u9fa5\s]/g,'-');ta.value=ta.value.substring(0,start)+result+ta.value.substring(end);ta.focus();ta.dispatchEvent(new Event('input'));}else{alert('请先选择内容');}}
function removeSep(){const ta=inputTextArea;if(ta.selectionStart!==ta.selectionEnd){const start=ta.selectionStart,end=ta.selectionEnd;const selected=ta.value.substring(start,end);const result=selected.replace(/[^\dA-Za-z\u4e00-\u9fa5\s]/g,'');ta.value=ta.value.substring(0,start)+result+ta.value.substring(end);ta.focus();ta.dispatchEvent(new Event('input'));}else{alert('请先选择内容');}}
function mark(){const ta=inputTextArea;if(ta.selectionStart!==ta.selectionEnd){const start=ta.selectionStart,end=ta.selectionEnd;const selected=ta.value.substring(start,end);const result=selected.replace(/[\r\n]+/g,' ').replace(/[\s]{2,}/g,' ').trim();ta.value=ta.value.substring(0,start)+result+ta.value.substring(end);ta.focus();ta.dispatchEvent(new Event('input'));}else{alert('请先选择内容');}}
